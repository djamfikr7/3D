name: API CI

on:
  push:
    paths:
      - 'server/api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'server/api/**'
      - '.github/workflows/api-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: server/api
        run: npm install
      - name: Lint
        working-directory: server/api
        run: npm run lint
      - name: Run
        working-directory: server/api
        run: node src/index.js & sleep 2; curl -sf http://localhost:8080/health
