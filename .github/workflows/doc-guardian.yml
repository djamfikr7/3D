name: Doc Guardian

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make script executable
        run: chmod +x .github/scripts/check_doc_guard.sh
      - name: Run checks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: .github/scripts/check_doc_guard.sh "$BASE_REF"
