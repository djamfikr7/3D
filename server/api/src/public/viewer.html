<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Three.js GLB Viewer (Minimal)</title>
    <style> body { margin:0; overflow:hidden; } #ui{position:fixed;top:8px;left:8px;background:#fff8;padding:6px;border-radius:6px} canvas{display:block} </style>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  </head>
  <body>
    <div id="ui">
      <input id="url" size="80" placeholder="Paste GLB URL (e.g., presigned export)" />
      <button id="load">Load</button>
    </div>
    <script>
      let scene, camera, renderer, controls;
      function init(){
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
        camera.position.set(2,2,2);
        renderer = new THREE.WebGLRenderer({antialias:true});
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
        scene.add(hemi);
        const dir = new THREE.DirectionalLight(0xffffff, 1);
        dir.position.set(5,5,5); scene.add(dir);
        window.addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
        animate();
      }
      function animate(){ requestAnimationFrame(animate); renderer.render(scene, camera); }
      async function loadGLB(url){
        const loader = new THREE.GLTFLoader();
        loader.load(url, (g)=>{ scene.add(g.scene); }, undefined, (e)=>{ alert('Load error: '+e); });
      }
      document.getElementById('load').onclick = ()=>{ const u=document.getElementById('url').value; if(u) loadGLB(u); };
      init();
    </script>
  </body>
</html>
