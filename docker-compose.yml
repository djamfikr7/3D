version: '3.9'
services:
  api:
    build: ./server/api
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - JWT_SECRET=dev-secret
      - DATABASE_URL=postgres://postgres:postgres@db:5432/capture3d
    depends_on:
      - db
  worker:
    build: ./workers/recon
    environment:
      - API_BASE=http://api:8080
    depends_on:
      - api
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=capture3d
    ports:
      - "5432:5432"
