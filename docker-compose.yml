version: '3.9'
services:
  api:
    build: ./server/api
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - JWT_SECRET=dev-secret
      - DATABASE_URL=postgres://postgres:postgres@db:5432/capture3d
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=capture3d-dev
      - S3_FORCE_PATH_STYLE=true
    depends_on:
      - db
      - minio
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh -c "sleep 3 && mc alias set local http://minio:9000 minioadmin minioadmin && mc mb -p local/capture3d-dev || true && mc ls local"

  worker:
    build: ./workers/recon
    environment:
      - API_BASE=http://api:8080
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=capture3d-dev
    depends_on:
      - api
      - minio
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=capture3d
    ports:
      - "5432:5432"
